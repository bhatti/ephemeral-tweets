[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ephemeral-tweets"
version = "0.1.0"
description = "Delete old Twitter/X tweets periodically with rate limiting and resumability"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Shahzad Bhatti" },
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ephemeral-tweets = "ephemeral_tweets.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/ephemeral_tweets"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
